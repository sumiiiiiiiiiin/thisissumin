<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="400" height="395.934" viewBox="0 0 400 395.934" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.eye {
  transform-box: fill-box;
  transform-origin: 50% 70%;
  animation: blink 4.5s infinite;
}

@keyframes blink {
  /* 처음 3초 동안 가만히 */
  0%, 20% {
    transform: scaleY(1);
  }

  /* 첫 번째 blink */
  22% {
    transform: scaleY(.06);
  }

  24% {
    transform: scaleY(.06);
  }

  30% {
    transform: scaleY(1);
  }

  /* 7초 정도 기다림 */
  30%, 100% {
    transform: scaleY(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .eye {
    animation: none;
  }
}
</style>
