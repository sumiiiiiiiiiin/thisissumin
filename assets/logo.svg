<svg width="70" height="70" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<g clip-path="url(#clip0_27_434)">
<rect width="70" height="70" fill="#FFE0C4"/>
<path d="M36.0627 57.7002C32.7836 57.7002 30.1253 55.8394 30.1253 53.5439C30.1253 51.2485 32.7836 49.3877 36.0627 49.3877" stroke="black" stroke-width="2" stroke-linecap="round"/>
<ellipse id="pupil-right" cx="48" cy="39.75" rx="3" ry="3.75" fill="black" style="transition: cx 0.12s ease-out, cy 0.12s ease-out;"/>
<ellipse id="pupil-left" cx="22" cy="39.75" rx="3" ry="3.75" fill="black" style="transition: cx 0.12s ease-out, cy 0.12s ease-out;"/>
<ellipse cx="22.4265" cy="13.6747" rx="22.4265" ry="13.6747" transform="matrix(0.819151 0.573577 -0.573575 0.819153 43.2585 -6.44434)" fill="#161616"/>
<ellipse cx="28.0541" cy="17.1062" rx="28.0541" ry="17.1062" transform="matrix(0.819151 -0.573577 0.573575 0.819153 -15 17.1824)" fill="#161616"/>
<rect x="-2" y="-6" width="72" height="22" fill="#161616"/>
<path id="glasses-right" d="M52 32.5C56.7646 32.5 61.0038 33.5763 63.999 35.2402C67.0451 36.9325 68.5 39.0307 68.5 41C68.5 42.9693 67.0451 45.0675 63.999 46.7598C61.0038 48.4237 56.7646 49.5 52 49.5C47.2354 49.5 42.9962 48.4237 40.001 46.7598C36.9549 45.0675 35.5 42.9693 35.5 41C35.5 39.0307 36.9549 36.9325 40.001 35.2402C42.9962 33.5763 47.2354 32.5 52 32.5Z" stroke="#AF0000" stroke-width="3"/>
<path id="glasses-left" d="M18 32.5C22.7646 32.5 27.0038 33.5763 29.999 35.2402C33.0451 36.9325 34.5 39.0307 34.5 41C34.5 42.9693 33.0451 45.0675 29.999 46.7598C27.0038 48.4237 22.7646 49.5 18 49.5C13.2354 49.5 8.99619 48.4237 6.00098 46.7598C2.95493 45.0675 1.5 42.9693 1.5 41C1.5 39.0307 2.95493 36.9325 6.00098 35.2402C8.99619 33.5763 13.2354 32.5 18 32.5Z" stroke="#AF0000" stroke-width="3"/>
</g>
<defs>
<clipPath id="clip0_27_434">
<rect width="70" height="70" fill="white"/>
</clipPath>
</defs>
<script type="text/javascript"><![CDATA[
(function () {
  var rightSocket = document.getElementById('glasses-right');
  var leftSocket  = document.getElementById('glasses-left');
  var rightPupil  = document.getElementById('pupil-right');
  var leftPupil   = document.getElementById('pupil-left');

  var base = {
    right: { cx: 48, cy: 39.75 },
    left:  { cx: 22, cy: 39.75 }
  };

  // 안경 소켓 안에서 눈동자가 움직일 수 있는 최대 범위(px, 이 파일의 좌표계 기준)
  var maxX = 6;
  var maxY = 2.5;
  // 이 거리(화면 px) 이상 멀어지면 최대치로 움직임
  var influence = 350;

  function moveEye(socket, pupil, b, mouseX, mouseY) {
    var rect = socket.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = mouseX - cx;
    var dy = mouseY - cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var scale = Math.min(dist / influence, 1);
    var angle = Math.atan2(dy, dx);
    pupil.setAttribute('cx', b.cx + Math.cos(angle) * maxX * scale);
    pupil.setAttribute('cy', b.cy + Math.sin(angle) * maxY * scale);
  }

  document.addEventListener('mousemove', function (e) {
    moveEye(rightSocket, rightPupil, base.right, e.clientX, e.clientY);
    moveEye(leftSocket, leftPupil, base.left, e.clientX, e.clientY);
  });

  document.addEventListener('mouseleave', function () {
    rightPupil.setAttribute('cx', base.right.cx);
    rightPupil.setAttribute('cy', base.right.cy);
    leftPupil.setAttribute('cx', base.left.cx);
    leftPupil.setAttribute('cy', base.left.cy);
  });
})();
]]></script>
</svg>
