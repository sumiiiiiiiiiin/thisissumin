<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  pre {
    white-space: pre;
    font-family: 'Courier New', Courier, monospace;
    /* Embedded-in-a-box addition only (not in the original file): the
       original clamp() assumed this renders full-browser-window, so
       0.62vw only ever reached its 7px ceiling on a very wide screen.
       Embedded in a small card-sized iframe, that ceiling left the art
       tiny with a lot of empty space around it. Replaced below with a
       JS-computed font-size that measures the actual rendered grid
       and fits it to whatever box this iframe ends up in. */
    font-size: 10px;
    line-height: 1.15;
    letter-spacing: 0.05em;
    color: #00ff41;
    text-shadow: 0 0 6px #00ff41, 0 0 14px rgba(0,255,65,0.3);
  }
</style>

let i = 0;
const d = document.getElementById('d');
d.textContent = f[0];
setInterval(() => { d.textContent = f[i++ % f.length]; }, 150);

// Embedded-in-a-box addition only (not in the original file): every
// frame shares the same character grid, so measuring once at a known
// reference font-size and scaling from there fits the whole animation
// to this iframe's actual box instead of relying on a vw-based guess
// tuned for a full browser window (see the CSS comment above).
function fit() {
  d.style.fontSize = '10px';
  const scaleX = window.innerWidth / d.scrollWidth;
  const scaleY = window.innerHeight / d.scrollHeight;
  const size = 10 * Math.min(scaleX, scaleY) * 0.96;
  d.style.fontSize = size + 'px';
}
fit();
window.addEventListener('resize', fit);
