<script type="text/javascript"><![CDATA[
(function () {
  var rightSocket = document.getElementById('glasses-right');
  var leftSocket  = document.getElementById('glasses-left');
  var rightPupil  = document.getElementById('pupil-right');
  var leftPupil   = document.getElementById('pupil-left');

  // 이 눈동자는 path 도형이라 cx/cy 대신 transform: translate로 이동시킵니다.
  var maxX = 8;
  var maxY = 3;
  var influence = 350; // 이 거리(화면 px) 이상 멀어지면 최대치로 움직임

  function moveEye(socket, pupil, mouseX, mouseY) {
    var rect = socket.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = mouseX - cx;
    var dy = mouseY - cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var scale = Math.min(dist / influence, 1);
    var angle = Math.atan2(dy, dx);
    var ox = Math.cos(angle) * maxX * scale;
    var oy = Math.sin(angle) * maxY * scale;
    pupil.style.transform = 'translate(' + ox + 'px, ' + oy + 'px)';
  }

  document.addEventListener('mousemove', function (e) {
    moveEye(rightSocket, rightPupil, e.clientX, e.clientY);
    moveEye(leftSocket, leftPupil, e.clientX, e.clientY);
  });

  document.addEventListener('mouseleave', function () {
    rightPupil.style.transform = 'translate(0px, 0px)';
    leftPupil.style.transform = 'translate(0px, 0px)';
  });
})();
]]></script>
</svg>
