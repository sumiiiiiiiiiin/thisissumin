<path d="M45.0724 7.10881C45.3649 7.03041 45.6759 7.13576 45.8607 7.37578L48.9412 11.379L53.9104 10.466C54.2082 10.4113 54.5099 10.5411 54.6749 10.795C54.8399 11.049 54.8366 11.3777 54.6655 11.6276L51.8088 15.795L54.2136 20.2381C54.3577 20.5045 54.328 20.8319 54.1375 21.0673C53.9469 21.3027 53.633 21.4002 53.3424 21.3147L48.4961 19.8866L45.0132 23.5465C44.8043 23.7658 44.4837 23.8383 44.2009 23.7298C43.9182 23.6212 43.7288 23.3525 43.7205 23.0497L43.5806 17.9998L39.0239 15.8187C38.7507 15.6879 38.5835 15.4049 38.5994 15.1024C38.6154 14.8 38.8117 14.5368 39.097 14.4353L43.856 12.7415L44.5231 7.73419L44.5464 7.62483C44.6186 7.3752 44.8162 7.17745 45.0724 7.10881Z" fill="#D9EDEE" stroke="#0272B2" stroke-width="1.5" stroke-linejoin="round"/>
